{% extends "base.html" %}
{% block title %}Vendor Login — ScootyBazaar{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="color:#7b1fa2;">🏪 Vendor Login</h2>
    <p class="subtitle">Login to manage your products and listings</p>

    <form method="post">
        <div class="form-group">
            <label>Username or Email *</label>
            <input type="text" name="identifier" required autofocus>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-submit" style="background:#7b1fa2;">Login as Vendor</button>
    </form>

    <div class="form-footer">
        New seller? <a href="{{ url_for('vendor_register') }}">Create a vendor account</a><br>
        <small style="color:#878787;">
            <strong>Demo vendor:</strong> scootybazaar / vendor123
        </small><br><br>
        <a href="{{ url_for('login') }}">← Back to Customer Login</a>
    </div>
</div>
{% endblock %}
