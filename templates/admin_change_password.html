{% extends "base.html" %}
{% block title %}Change Admin Password{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="color:#1a237e;">🔑 Change Admin Password</h2>
    <p class="subtitle">Update your admin password. You'll need to login again after saving.</p>

    <form method="post">
        <div class="form-group">
            <label>Current Password *</label>
            <input type="password" name="current" required autofocus autocomplete="current-password">
        </div>
        <div class="form-group">
            <label>New Password *</label>
            <input type="password" name="new" required minlength="6" autocomplete="new-password">
            <p style="font-size:12px; color:#878787; margin-top:6px;">
                At least 6 characters. Use a mix of letters, numbers and symbols.
            </p>
        </div>
        <div class="form-group">
            <label>Confirm New Password *</label>
            <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
        </div>

        <div style="display:flex; gap:10px;">
            <button type="submit" class="btn-submit" style="background:#1a237e;">
                Change Password
            </button>
            <a href="{{ url_for('admin_dashboard') }}"
               style="padding:12px 24px; background:#e0e0e0; border-radius:3px; color:#424242; font-weight:500; text-transform:uppercase; font-size:15px; text-align:center;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
