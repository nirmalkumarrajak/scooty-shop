{% extends "base.html" %}
{% block title %}Become a Seller — ScootyBazaar{% endblock %}

{% block content %}
<div class="form-container wide">
    <h2>🏪 Become a Seller on ScootyBazaar</h2>
    <p class="subtitle">List your scooters and accessories to thousands of buyers</p>

    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Business Name *</label>
                <input type="text" name="business_name" required placeholder="e.g., ABC Motors">
            </div>
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" name="phone" required placeholder="10-digit number"
                       pattern="[0-9]{10,13}">
            </div>
        </div>

        <div class="form-group">
            <label>Business Address</label>
            <textarea name="business_address" placeholder="Shop address, city, state, PIN" style="min-height: 70px;"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" name="confirm" required minlength="6">
            </div>
        </div>

        <button type="submit" class="btn-submit">Register as Vendor</button>
    </form>

    <div class="form-footer">
        Already have a vendor account? <a href="{{ url_for('vendor_login') }}">Vendor Login →</a><br>
        <small style="color:#878787;">Are you a buyer? <a href="{{ url_for('register') }}">Customer signup →</a></small>
    </div>
</div>
{% endblock %}
