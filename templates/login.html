{% extends "base.html" %}
{% block title %}Customer Login — ScootyBazaar{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Customer Login</h2>
    <p class="subtitle">Login to place orders and track your purchases</p>

    <form method="post">
        <div class="form-group">
            <label>Username or Email *</label>
            <input type="text" name="identifier" required autofocus>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-submit blue">Login</button>
    </form>

    <div class="form-footer">
        New here? <a href="{{ url_for('register') }}">Create an account</a><br>
        <small style="color:#878787;">Are you a seller? <a href="{{ url_for('vendor_login') }}">Vendor Login →</a></small>
    </div>
</div>
{% endblock %}
