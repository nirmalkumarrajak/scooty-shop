{% extends "base.html" %}
{% block title %}Portal{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="color:#1a237e;">🔐 Secure Portal</h2>
    <p class="subtitle">Authorized access only</p>

    <form method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" style="background:#1a237e;">
            Login
        </button>
    </form>

    <div class="form-footer">
        <small style="color:#878787;">
            Restricted area. All access attempts are logged.
        </small>
    </div>
</div>
{% endblock %}
